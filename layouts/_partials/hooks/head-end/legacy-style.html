{{/* Small style tweaks to keep the look of the old Wowchemy site. */}}
<style>
  h1, h2, h3, h4, h5, h6 { font-family: var(--hb-font-heading); }
  .hb-attachment-link.hb-attachment-link {
    display: inline-flex; align-items: center; gap: .25rem;
    padding: .1rem .45rem; font-size: .75rem; line-height: 1.4;
    border: 1px solid var(--color-primary-700); border-radius: .2rem;
    color: var(--color-primary-700); background: transparent; text-transform: none; font-weight: 400; letter-spacing: 0;
  }
  .hb-attachment-link.hb-attachment-link:hover { background: var(--color-primary-700); color: #fff; }
  .hb-attachment-link.hb-attachment-link svg { display: none; }
  /* Old navbar: NJIT logo only, a bit larger */
  .navbar-brand svg, .navbar-brand img { height: 45px; width: auto; }
  .hb-attachment-link-large.hb-attachment-link-large { font-size: .875rem; padding: .2rem .6rem; }
  /* Old page titles were Montserrat regular, not bold */
  main h1:first-of-type { font-weight: 400; }
  /* Old link style: primary colour, no underline */
  .prose a:not(.hb-attachment-link) { color: var(--color-primary-700); text-decoration: none; font-weight: inherit; }
  .prose a:not(.hb-attachment-link):hover { text-decoration: underline; }
  /* Tighter menu bar, like the old site */
  #nav-menu { column-gap: 0; }
  #nav-menu > * { margin-left: 0 !important; margin-right: 0 !important; }
  #nav-menu .nav-link { font-family: var(--hb-font-body); font-size: 15px; font-weight: 500; padding-left: .6rem; padding-right: .6rem; }
</style>
