# Font pack matching the old Wowchemy "minimal" font set (Montserrat headings, Roboto body)
hugoblox:
  meta:
    format: "hugoblox-font@1"
    name: "Minimal"
    vendor: "roygoodman"
    version: "1.0.0"
    license: "MIT"
    style: "sans"
    description: "Montserrat + Roboto, as on the old Wowchemy site"

  families:
    heading: "Montserrat"
    body: "Roboto"
    code: "Roboto Mono"

  weights:
    heading: [400, 700]
    body: [400, 700]
    code: [400]

  leading:
    heading: 1.25
    body: 1.6
    code: 1.5

  tracking:
    heading: "0"
    body: "0"

  variable:
    heading: true
    body: false
    code: false
